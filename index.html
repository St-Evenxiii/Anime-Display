<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; width:800px; height:480px; background:#fff; overflow:hidden; }
  img { width:800px; height:480px; object-fit:contain; }
  #credit { position:absolute; bottom:4px; right:8px; font:14px sans-serif;
            background:#fff; padding:2px 6px; }
</style>
</head>
<body>
<img id="pic" alt="">
<div id="credit"></div>
<script>
fetch("https://nekos.best/api/v2/neko")
  .then(r => r.json())
  .then(d => {
    const item = d.results[0];
    document.getElementById("pic").src = item.url;
    document.getElementById("credit").textContent = item.artist_name || "";
  })
  .catch(() => {
    document.getElementById("credit").textContent = "Couldn't fetch today's picture";
  });
</script>
</body>
</html>
